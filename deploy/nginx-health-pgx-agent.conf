# Static PGx assistant mounted under https://health.yelchervya.com/pgx/
#
# Put this block inside the existing server { ... } for health.yelchervya.com.
# The trailing slashes in both location and alias are important.

location /pgx/ {
    alias /var/www/health-pgx-agent/;
    index index.html;
    try_files $uri $uri/ /pgx/index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

